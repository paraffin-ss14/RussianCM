# The parts of the weapons: for each platform a barrel, a receiver, a bolt and a grip, each crude, standard and fine. Made at the lathe and at the fabricator (part_recipes.yml).

- type: entity
  parent: BaseItem
  id: RUMCPartPistolBarrelCrude
  name: crude pistol barrel
  description: A part of a pistol, made roughly. It goes into the slot of its kind in the weapon assembly bench.
  components:
  - type: Sprite
    sprite: CMU14/Objects/Weapons/Gunsmith/parts.rsi
    state: pistol_front
    noRot: true
  - type: Item
    size: Small
  - type: Tag
    tags:
    - RUMCWeaponPartBarrel
  - type: WeaponPart
    kind: Barrel
    grade: Crude
    platform: RUMCPlatformPistol
    safety: 1.35
    reliability: 0.95
    caliber: GunsmithCaliber9mm
    barrelLengthMm: 110
    damageMult: 0.85
    scatterAdd: 3.0
    fatigueShots: 150
    heatPerShotK: 12
    limitTempC: 600

